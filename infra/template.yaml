AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: C-arot Phase 2 authentication, user data, and protected API foundation.

Parameters:
  FrontendOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Exact browser origin allowed to call the HTTP API.
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito managed-login domain prefix.
  GoogleClientId:
    Type: String
    Description: Google OAuth web client ID from Google Cloud Console.
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth web client secret from Google Cloud Console.
  CallbackUrls:
    Type: CommaDelimitedList
    Default: http://localhost:3000/api/auth/callback
    Description: Cognito callback URLs. Add the production URL before deploying production.
  LogoutUrls:
    Type: CommaDelimitedList
    Default: http://localhost:3000/
    Description: Cognito logout URLs. Add the production URL before deploying production.
  TableName:
    Type: String
    Default: carot-user-data

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: tier
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints:
            MinLength: '4'
            MaxLength: '10'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref UserPool
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        name: name

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub ${AWS::StackName}-web
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO
        - Google
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      WriteAttributes:
        - email
        - name
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH

  UserDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  UserApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

  HistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: src/history.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref UserDataTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
      Events:
        HistoryApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserApi
            Path: /history
            Method: ANY
        HistoryItemApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserApi
            Path: /history/{id}
            Method: ANY
        ProfileApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserApi
            Path: /profile
            Method: ANY

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  UserApiUrl:
    Value: !Sub https://${UserApi}.execute-api.${AWS::Region}.amazonaws.com
  UserDataTableName:
    Value: !Ref UserDataTable

