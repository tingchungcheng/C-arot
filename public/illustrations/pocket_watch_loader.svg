<g opacity=".18" stroke="#f5e9d8" stroke-width="2"><path d="M112 128 C108 112 108 100 112 100 C116 100 117 112 116 124"/><path d="M128 128 C132 112 132 100 128 100 C124 100 123 112 124 124"/><circle cx="120" cy="140" r="15"/></g>
<line id="hand-hour" x1="120" y1="130" x2="120" y2="92" stroke="#f5e9d8" stroke-width="3.2"><animateTransform attributeName="transform" type="rotate" from="0 120 130" to="360 120 130" dur="24s" repeatCount="indefinite"/></line>
