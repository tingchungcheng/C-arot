<g id="loader-rabbit" stroke="#f5e9d8" stroke-width="2"><path d="M110 40 C104 22 104 8 110 8 C116 8 117 24 115 38"/><path d="M130 40 C136 22 136 8 130 8 C124 8 123 24 125 38"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -2;0 6" dur="2s" repeatCount="indefinite"/></g>
<path d="M104 40 h32" stroke="#f2762e" stroke-width="2"/>
<circle cx="120" cy="40" r="8" stroke="#f2762e" stroke-width="2.2" fill="#0b0a09"/>
<circle cx="120" cy="130" r="80" stroke="#f2762e" stroke-width="2.4" fill="#0b0a09"/>
<circle cx="120" cy="130" r="72" stroke="#d9b26a" stroke-width=".8" opacity=".6"/>
