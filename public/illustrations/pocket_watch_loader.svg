<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none" stroke-linecap="round" stroke-linejoin="round">
<!-- GSAP targets: #watch-glow (pulse), #hand-minute (rotate 360 / 2s), #hand-hour (rotate 360 / 24s), #loader-rabbit (peek y). transform-origin: 120px 130px -->
